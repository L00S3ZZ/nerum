<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg: #08000f;
    --panel: rgba(255,255,255,0.04);
    --border: rgba(255,255,255,0.08);
    --text: #ffffff;
    --muted: rgba(255,255,255,0.55);
    --brand: #C50022;
  }
  html, body { height:100%; }
  body { font-family:'Space Grotesk',-apple-system,BlinkMacSystemFont,sans-serif; background:var(--bg); color:var(--text); display:flex; flex-direction:column; min-height:100vh; }

  .header { display:flex; align-items:center; gap:14px; padding:16px 22px; background:rgba(0,0,0,0.4); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:10; backdrop-filter:blur(20px); }
  .header .logo { width:42px; height:42px; border-radius:10px; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:18px; overflow:hidden; flex-shrink:0; }
  .header .logo img { width:100%; height:100%; object-fit:cover; }
  .header .info { flex:1; min-width:0; }
  .header .name { font-size:16px; font-weight:600; line-height:1.2; }
  .header .company { font-size:12px; color:var(--muted); margin-top:2px; }
  .header .powered { font-size:11px; color:var(--muted); }
  .header .powered a { color:var(--brand); text-decoration:none; font-weight:500; }
  .header .powered a:hover { text-decoration:underline; }

  .messages { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:10px; max-width:780px; width:100%; margin:0 auto; }
  .msg { padding:11px 15px; border-radius:14px; font-size:14px; line-height:1.5; max-width:78%; word-wrap:break-word; }
  .msg.bot { background:var(--panel); color:var(--text); border:1px solid var(--border); align-self:flex-start; border-bottom-left-radius:4px; }
  .msg.user { color:#fff; align-self:flex-end; border-bottom-right-radius:4px; }

  .typing { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:11px 15px; align-self:flex-start; display:inline-flex; gap:5px; }
  .typing span { width:7px; height:7px; background:var(--muted); border-radius:50%; animation:dot 1.2s infinite ease-in-out; }
  .typing span:nth-child(2) { animation-delay:0.15s; }
  .typing span:nth-child(3) { animation-delay:0.3s; }
  @keyframes dot { 0%,80%,100% { transform:scale(0.6); opacity:0.4; } 40% { transform:scale(1); opacity:1; } }

  .input-bar { background:rgba(0,0,0,0.4); border-top:1px solid var(--border); padding:14px 20px; backdrop-filter:blur(20px); position:sticky; bottom:0; }
  .input-row { max-width:780px; margin:0 auto; display:flex; gap:8px; }
  .input-row input { flex:1; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:12px 16px; color:var(--text); font-size:14px; font-family:inherit; outline:none; }
  .input-row input:focus { border-color:var(--brand); }
  .input-row button { border:none; border-radius:12px; padding:12px 22px; color:#fff; font-weight:600; font-size:14px; cursor:pointer; font-family:inherit; transition:opacity 0.2s,transform 0.15s; }
  .input-row button:hover { opacity:0.92; transform:translateY(-1px); }
  .input-row button:disabled { opacity:0.5; cursor:not-allowed; transform:none; }

  .loading { display:flex; align-items:center; justify-content:center; flex:1; color:var(--muted); font-size:14px; }
  .error { display:flex; align-items:center; justify-content:center; flex:1; flex-direction:column; gap:10px; color:var(--muted); padding:20px; text-align:center; }
  .error .icon { font-size:36px; }

  @media (max-width:600px) {
    .header { padding:12px 16px; }
    .header .logo { width:38px; height:38px; font-size:16px; }
    .header .name { font-size:14px; }
    .header .company { font-size:11px; }
    .messages { padding:14px; }
    .msg { font-size:13.5px; max-width:88%; }
    .input-bar { padding:10px 14px; }
    .input-row input { padding:11px 14px; }
    .input-row button { padding:11px 18px; }
  }
</style>
</head>
<body>
<div class="loading" id="loading">Loading…</div>

<script>
(function () {
  var path = window.location.pathname;
  var m = path.match(/\/chat\/([^\/?#]+)/);
  var EMBED_ID = m ? m[1] : null;
  var BASE = window.location.origin;
  var VISITOR_ID;
  try {
    VISITOR_ID = localStorage.getItem("nerum_visitor_id");
    if (!VISITOR_ID) {
      VISITOR_ID = "v_" + Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem("nerum_visitor_id", VISITOR_ID);
    }
  } catch (e) { VISITOR_ID = "v_anon"; }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function showError(msg) {
    document.body.innerHTML = '<div class="error"><div class="icon">⚠️</div><div>' + esc(msg) + '</div></div>';
  }

  if (!EMBED_ID) { showError("Invalid chat link."); return; }

  fetch(BASE + "/chatbots/widget/" + EMBED_ID)
    .then(function (r) {
      if (!r.ok) throw new Error("not_found");
      return r.json();
    })
    .then(function (cfg) { render(cfg); })
    .catch(function () { showError("This chatbot is unavailable."); });

  function render(cfg) {
    var color = cfg.brand_color || "#C50022";
    var name = cfg.bot_name || "Assistant";
    var company = cfg.company_name || "";
    var welcome = cfg.welcome_message || "Hi! How can I help you?";
    var init = (name || "A").charAt(0).toUpperCase();
    var logoHtml = cfg.logo_url ? '<img src="' + esc(cfg.logo_url) + '" alt="">' : esc(init);
    document.documentElement.style.setProperty("--brand", color);
    document.title = name + (company ? " · " + company : "");

    document.body.innerHTML =
      '<div class="header">' +
        '<div class="logo" style="background:' + color + ';">' + logoHtml + "</div>" +
        '<div class="info">' +
          '<div class="name">' + esc(name) + "</div>" +
          (company ? '<div class="company">' + esc(company) + "</div>" : "") +
        "</div>" +
        '<div class="powered">Powered by <a href="https://nerum.in" target="_blank" rel="noopener">Nerum</a></div>' +
      "</div>" +
      '<div class="messages" id="msgs"></div>' +
      '<div class="input-bar"><div class="input-row">' +
        '<input id="input" type="text" placeholder="Type a message..." autocomplete="off">' +
        '<button id="send" style="background:' + color + ';">Send</button>' +
      "</div></div>";

    var msgs = document.getElementById("msgs");
    var input = document.getElementById("input");
    var sendBtn = document.getElementById("send");

    function append(role, text) {
      var div = document.createElement("div");
      div.className = "msg " + role;
      if (role === "user") div.style.background = color;
      div.textContent = text;
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    }
    function appendTyping() {
      var div = document.createElement("div");
      div.className = "typing";
      div.id = "typing-el";
      div.innerHTML = "<span></span><span></span><span></span>";
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    }
    function removeTyping() {
      var el = document.getElementById("typing-el");
      if (el) el.remove();
    }

    append("bot", welcome);
    input.focus();

    function send() {
      var text = (input.value || "").trim();
      if (!text) return;
      input.value = "";
      append("user", text);
      sendBtn.disabled = true;
      appendTyping();
      fetch(BASE + "/chatbots/chat/" + EMBED_ID, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, visitor_id: VISITOR_ID }),
      })
        .then(function (r) {
          return r.json().then(function (data) { return { ok: r.ok, status: r.status, data: data }; });
        })
        .then(function (res) {
          removeTyping();
          if (!res.ok) {
            if (res.status === 429) {
              append("bot", "This chatbot has hit its limit for now. Please try again later.");
            } else {
              append("bot", (res.data && res.data.detail) || "Sorry, something went wrong.");
            }
            return;
          }
          append("bot", res.data.response || "…");
        })
        .catch(function () {
          removeTyping();
          append("bot", "Network error. Please try again.");
        })
        .finally(function () {
          sendBtn.disabled = false;
          input.focus();
        });
    }
    sendBtn.addEventListener("click", send);
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); send(); }
    });
  }
})();
</script>
</body>
</html>
