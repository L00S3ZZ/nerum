# ============================================================================
# NERUM — Nginx reverse proxy   (server 193.203.161.111 · nerum.in)
# ----------------------------------------------------------------------------
# Deploy as a site config that is included INSIDE the http{} block, e.g.
#   /etc/nginx/conf.d/nerum.conf            (conf.d/* is auto-included in http{})
# or  /etc/nginx/sites-available/nerum  + symlink into sites-enabled/.
# The limit_req_zone + map + gzip directives below are http-context; they only
# work because conf.d/sites-* files are pulled into http{}. Do NOT wrap this in
# another http{} block.
#
# Routing:
#   https://nerum.in/           -> Next.js   127.0.0.1:3000
#   https://nerum.in/api/...    -> FastAPI   127.0.0.1:8000   (the /api prefix is
#                                  stripped by the trailing slash on proxy_pass)
# Backend is bound to 127.0.0.1 only — the browser reaches it solely through here.
# ============================================================================

upstream nerum_frontend { server 127.0.0.1:3000; keepalive 32; }
upstream nerum_backend  { server 127.0.0.1:8000; keepalive 32; }

# Rate limit: auth endpoints (login/register/verify/forgot) — per client IP.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

# WebSocket upgrade map: send "upgrade" only when the client asked for it,
# otherwise "" so keepalive to the upstream is preserved.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain text/css text/xml application/json application/javascript
    application/xml+rss application/rss+xml application/atom+xml
    image/svg+xml font/ttf font/otf font/woff font/woff2;

# ---------------------------------------------------------------------------
# HTTP -> HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name nerum.in www.nerum.in;
    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------------
# HTTPS
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nerum.in www.nerum.in;

    # SSL — certs already issued (Hostinger / Let's Encrypt). Adjust paths if needed.
    ssl_certificate     /etc/letsencrypt/live/nerum.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nerum.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 10M;

    # Security headers (server-level — applied to every location below, since no
    # location issues its own add_header which would otherwise shadow these).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection          "1; mode=block" always;

    # -----------------------------------------------------------------------
    # Agent SSE stream — buffering OFF or events stall. /api/agent/run -> /agent/run
    # -----------------------------------------------------------------------
    location = /api/agent/run {
        proxy_pass http://nerum_backend/agent/run;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_set_header X-Accel-Buffering no;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    # -----------------------------------------------------------------------
    # Auth routes — rate limited. /api/auth/... -> /auth/...
    # -----------------------------------------------------------------------
    location /api/auth/ {
        limit_req zone=auth_limit burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://nerum_backend/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }

    # -----------------------------------------------------------------------
    # Everything else under /api -> FastAPI. Trailing slash STRIPS /api.
    #   /api/dashboard/stats -> /dashboard/stats
    # -----------------------------------------------------------------------
    location /api/ {
        proxy_pass http://nerum_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # -----------------------------------------------------------------------
    # Next.js frontend — WebSocket upgrade supported (builder / HMR).
    # -----------------------------------------------------------------------
    location / {
        proxy_pass http://nerum_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 90s;
    }
}
